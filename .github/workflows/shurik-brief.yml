name: Update Shurik brief
run-name: Update the three sourcing agents with the latest project brief

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shurik-brief-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        member: [maps-n-stuff-sources-20261020-0, maps-n-stuff-sources-20261020-1, maps-n-stuff-sources-20261020-2]
    env:
      SHURIK_MEMBER: ${{ matrix.member }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Preserve the existing hard deadline
        id: settings
        run: |
          export SAVED_CONTROL=$(git show "origin/shurik-control/$SHURIK_MEMBER:control.json")
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const { deadline } = JSON.parse(process.env.SAVED_CONTROL);
          if (!deadline || Date.parse(deadline) <= Date.now()) throw new Error('The sourcing deadline has expired. No member will be resumed.');
          appendFileSync(process.env.GITHUB_OUTPUT, `deadline=${deadline}\n`);
          JS
      - name: Stop the member before updating its brief
        uses: igor-makarov/shurik@v2
        with:
          command: stop
          loop-id: ${{ matrix.member }}
      - name: Copy the current main brief without changing product work
        run: |
          git fetch origin "refs/heads/$SHURIK_MEMBER:refs/remotes/origin/$SHURIK_MEMBER" refs/heads/main:refs/remotes/origin/main
          git switch --create "brief-update-$SHURIK_MEMBER" "origin/$SHURIK_MEMBER"
          git restore --source=origin/main --worktree -- SOURCING_PROMPT.md SOURCING_STEERING.md
          if ! git diff --quiet -- SOURCING_PROMPT.md SOURCING_STEERING.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add SOURCING_PROMPT.md SOURCING_STEERING.md
            git commit -m 'Update project brief from main'
            git push origin "HEAD:refs/heads/$SHURIK_MEMBER"
          fi
      - name: Resume with the saved model and swarm identity
        uses: igor-makarov/shurik@v2
        with:
          command: resume
          loop-id: ${{ matrix.member }}
          create-pr: 'false'
          checkpoint-seconds: '0'
          deadline: ${{ steps.settings.outputs.deadline }}
