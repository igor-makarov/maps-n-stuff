name: Stop Shurik swarm
run-name: Stop all four Shurik agents

on:
  push:
    branches: [main]
    paths: [.github/workflows/shurik-stop.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        member: [zurich-maps-0, zurich-maps-1, zurich-maps-2, zurich-maps-3]
    concurrency:
      group: shurik-control-${{ matrix.member }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stop the member and cancel its active iteration
        uses: igor-makarov/shurik@v2
        with:
          command: stop
          loop-id: ${{ matrix.member }}
